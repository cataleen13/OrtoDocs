[project]
name = "ortodocs"
version = "1.0.0"
description = "Aplicație desktop locală pentru generarea documentelor medicale OrtoDocs."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "python-docx==1.2.0",
    "lxml==6.1.3",
    "tk-date-entry==1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
